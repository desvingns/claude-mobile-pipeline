name: validate-plugins

# CI gate for the mobile-pipeline marketplace. Runs on every PR (incl. the auto-opened
# improve/* PRs from the downstream self-improvement flow) and on push to main.
on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  validate:
    name: validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Manifests are valid JSON
        run: |
          set -e
          files=".claude-plugin/marketplace.json .agents/plugins/marketplace.json $(find claude-plugins codex-plugins -name plugin.json)"
          for f in $files; do echo "checking $f"; python -c "import json; json.load(open('$f', encoding='utf-8'))"; done

      - name: Manifest versions match root VERSION
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          expected = Path('VERSION').read_text(encoding='utf-8').strip()
          files = [
              Path('claude-plugins/mp-dev/.claude-plugin/plugin.json'),
              Path('claude-plugins/mp-spec/.claude-plugin/plugin.json'),
              Path('codex-plugins/mp-dev/.codex-plugin/plugin.json'),
              Path('codex-plugins/mp-spec/.codex-plugin/plugin.json'),
              Path('templates/dev/codex/.codex-plugin/plugin.json'),
          ]
          failures = []
          for path in files:
              actual = json.loads(path.read_text(encoding='utf-8')).get('version')
              if actual != expected:
                  failures.append(f'{path}: {actual!r} != {expected!r}')
          marketplace = json.loads(Path('.claude-plugin/marketplace.json').read_text(encoding='utf-8'))
          actual = marketplace.get('metadata', {}).get('version')
          if actual != expected:
              failures.append(f'.claude-plugin/marketplace.json metadata.version: {actual!r} != {expected!r}')
          if failures:
              raise SystemExit('manifest version drift:\n' + '\n'.join(failures))
          PY

      - name: Shell scripts parse (bash -n)
        run: |
          set -e
          for d in lib claude-plugins codex-plugins templates selfimprove eval scripts tests; do
            [ -d "$d" ] || continue
            find "$d" -name '*.sh' -print0 | while IFS= read -r -d '' s; do echo "bash -n $s"; bash -n "$s"; done
          done
          for s in bootstrap.sh install-spec.sh; do [ -f "$s" ] && { echo "bash -n $s"; bash -n "$s"; }; done

      - name: shellcheck (error severity)
        if: runner.os == 'Linux'
        run: |
          set -e
          command -v shellcheck >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck; }
          # -S error: retrofit gate — block on real errors, not legacy style warnings
          for d in lib claude-plugins codex-plugins templates selfimprove eval scripts tests; do
            [ -d "$d" ] || continue
            find "$d" -name '*.sh' -print0 | while IFS= read -r -d '' s; do echo "shellcheck $s"; shellcheck -S error "$s"; done
          done
          for s in bootstrap.sh install-spec.sh; do [ -f "$s" ] && { echo "shellcheck $s"; shellcheck -S error "$s"; }; done

      - name: Deterministic infrastructure and eval tests
        run: |
          set -e
          bash tests/test-sync.sh
          bash tests/test-render-properties.sh
          bash tests/test-selfimprove.sh
          bash tests/test-proposals.sh
          bash tests/test-eval.sh
          bash tests/test-optimization-scripts.sh
          bash tests/test-brain-memory.sh
          bash tests/test-install-spec.sh
          bash tests/test-graphify-wrapper.sh
          bash tests/test-bootstrap.sh
          bash eval/runner.sh

      - name: Marketplace generator parses on every host
        run: bash lib/build-marketplace.sh --dry-run >/dev/null

      - name: No template-placeholder or marker leaks
        run: |
          set -e
          if grep -rnE '\{\{[A-Z_]+\}\}' claude-plugins codex-plugins; then
            echo "::error::placeholder {{...}} leaked into generated plugins"; exit 1; fi
          # mp-dev must be fully platform/tool-resolved; mp-spec intentionally keeps inert platform: comments
          if grep -rnE '<!-- /?(tool|platform):' claude-plugins/mp-dev codex-plugins/mp-dev; then
            echo "::error::tool/platform marker leaked into mp-dev"; exit 1; fi
          if grep -rnE '<!-- /?tool:' claude-plugins/mp-spec codex-plugins/mp-spec; then
            echo "::error::tool: marker leaked into mp-spec"; exit 1; fi

      - name: Generated trees match templates (regeneration drift)
        if: runner.os == 'Linux'
        run: |
          set -e
          tracked=(
            claude-plugins
            codex-plugins
            .claude-plugin/marketplace.json
            templates/dev/codex/.codex-plugin/plugin.json
          )
          bash lib/build-marketplace.sh >/dev/null
          git diff --binary -- "${tracked[@]}" > "$RUNNER_TEMP/regen-first.diff"
          bash lib/build-marketplace.sh >/dev/null
          git diff --binary -- "${tracked[@]}" > "$RUNNER_TEMP/regen-second.diff"
          if ! cmp -s "$RUNNER_TEMP/regen-first.diff" "$RUNNER_TEMP/regen-second.diff"; then
            echo "::error::lib/build-marketplace.sh is not idempotent (the second run changed its output again)."
            exit 1
          fi
          if ! git diff --quiet --ignore-cr-at-eol -- "${tracked[@]}"; then
            echo "::error::generated marketplace artifacts are out of sync. Run ./lib/build-marketplace.sh and commit every tracked artifact."
            git --no-pager diff --stat -- "${tracked[@]}"
            exit 1
          fi
          echo "marketplace artifacts are in sync and regeneration is idempotent"
